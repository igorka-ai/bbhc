# Railway staging environment config
# Used by the "bbhc-staging" service in Railway.
# Production config lives in railway.toml (tracked by the "production" service).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.cjs"
healthcheckPath = "/api/games"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Staging-specific env vars are set in the Railway dashboard, not here.
# Required variables for the staging service:
#   PORT        = 5000         (Railway injects this automatically)
#   NODE_ENV    = production
#   DB_PATH     = /data/bbhc-staging.db   (separate file from prod on the same volume, or a separate volume)
#   ENVIRONMENT = staging      (lets the app know it's not prod — useful for banners, logging, etc.)
